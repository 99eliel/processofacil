name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish compiled fallback to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf assets
          cp dist/index.html index.html
          cp -R dist/assets assets
          if [ -f dist/sw.js ]; then cp dist/sw.js sw.js; fi
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets sw.js .nojekyll
          if git diff --cached --quiet; then
            echo "Compiled fallback already current."
          else
            git commit -m "build: publish compiled fallback [skip ci]"
            git push
          fi
